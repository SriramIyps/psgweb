<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PSG CAS — HR Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root { --maroon:#7b1c1c; --maroon-dark:#5c1414; }
    *, ::before, ::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Inter", system-ui, sans-serif; background: #f1f5f9; color: #0f172a; min-height: 100vh; }
    a { color: inherit; text-decoration: none; }
    .topbar { background: #1e293b; padding: .875rem 1.5rem; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 40; }
    .topbar-left { display: flex; align-items: center; gap: .875rem; }
    .topbar-left img { height: 42px; border-radius: .375rem; }
    .topbar-brand { color: #fff; font-size: .9375rem; font-weight: 600; }
    .topbar-brand span { color: #818cf8; }
    .topbar-right { display: flex; align-items: center; gap: 1rem; }
    .role-badge { font-size: .72rem; font-weight: 700; padding: .25rem .75rem; border-radius: 9999px; background: #fae8ff; color: #86198f; }
    .user-info { font-size: .8125rem; color: #94a3b8; }
    .btn-logout { font-size: .8125rem; padding: .375rem .875rem; border-radius: .375rem; background: #ef4444; color: #fff; border: none; cursor: pointer; }
    .btn-logout:hover { background: #dc2626; }
    .main { max-width: 1200px; margin: 0 auto; padding: 2rem; }
    .page-title { font-size: 1.375rem; font-weight: 700; margin-bottom: .25rem; }
    .page-sub { font-size: .875rem; color: #475569; margin-bottom: 1.5rem; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1rem; margin-bottom: 1.75rem; }
    .stat-card { background: #fff; border-radius: .875rem; padding: 1.25rem 1rem; border: 1px solid #e2e8f0; }
    .stat-card .stat-val { font-size: 1.875rem; font-weight: 800; color: var(--maroon); }
    .stat-card .stat-label { font-size: .8125rem; color: #64748b; margin-top: .25rem; }
    .table-card { background: #fff; border-radius: .875rem; border: 1px solid #e2e8f0; overflow: hidden; }
    .table-header { padding: 1rem 1.25rem; border-bottom: 1px solid #e2e8f0; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: .75rem; }
    .table-header h3 { font-size: 1rem; font-weight: 600; }
    .ctrl-bar { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
    .ctrl-bar input { padding: .4375rem .75rem; border: 1px solid #e2e8f0; border-radius: .5rem; font-size: .8125rem; outline: none; width: 220px; }
    .btn-refresh { padding: .4375rem .875rem; background: #f1f5f9; color: #334155; border: 1px solid #e2e8f0; border-radius: .5rem; font-size: .8125rem; cursor: pointer; }
    .btn-refresh:hover { background: #e2e8f0; }
    table { width: 100%; border-collapse: collapse; font-size: .8125rem; }
    thead th { background: #f8fafc; padding: .625rem 1rem; text-align: left; font-weight: 600; color: #475569; border-bottom: 1px solid #e2e8f0; white-space: nowrap; }
    tbody tr { border-bottom: 1px solid #f1f5f9; transition: background .1s; }
    tbody tr:hover { background: #fdf9f9; }
    tbody td { padding: .625rem 1rem; color: #334155; vertical-align: middle; }
    .badge { display: inline-block; font-size: .7rem; font-weight: 600; padding: .15rem .5rem; border-radius: 9999px; background: #dbeafe; color: #1e40af; }
    .btn-view { padding: .3rem .6rem; font-size: .72rem; border-radius: .375rem; border: 1px solid #e2e8f0; background: #fff; cursor: pointer; color: #334155; }
    .btn-view:hover { background: #f1f5f9; }
    .empty-state { text-align: center; padding: 4rem 2rem; color: #94a3b8; }
    .empty-state i { font-size: 3rem; margin-bottom: 1rem; display: block; }
    .overlay { display: none; position: fixed; inset: 0; z-index: 200; background: rgba(15,23,42,.55); backdrop-filter: blur(4px); align-items: center; justify-content: center; padding: 1rem; }
    .overlay.active { display: flex; }
    .modal-box { background: #fff; border-radius: 1.25rem; padding: 0; width: 100%; max-width: 800px; max-height: 92vh; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 25px 50px -12px rgba(0,0,0,.25); animation: fadeUp .2s ease; }
    @keyframes fadeUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
    .modal-head { padding: 1.25rem 1.5rem; border-bottom: 1px solid #e2e8f0; display: flex; align-items: center; justify-content: space-between; }
    .modal-head h2 { font-size: 1rem; font-weight: 700; }
    .modal-close { background: none; border: none; font-size: 1.375rem; color: #94a3b8; cursor: pointer; }
    .modal-close:hover { color: #0f172a; }
    .modal-body { padding: 1.5rem; overflow-y: auto; flex: 1; }
    .modal-foot { padding: 1rem 1.5rem; border-top: 1px solid #e2e8f0; display: flex; gap: .75rem; justify-content: flex-end; }
    .modal-foot button { padding: .5rem 1.25rem; border-radius: .5rem; font-size: .875rem; font-weight: 500; cursor: pointer; border: none; background: #f1f5f9; color: #334155; }
    .dsec-title { font-size: .72rem; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: #94a3b8; margin: 1.25rem 0 .75rem; border-bottom: 1px solid #f1f5f9; padding-bottom: .375rem; }
    .dsec-title:first-child { margin-top: 0; }
    .dfgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: .875rem; }
    .dfield label { font-size: .72rem; font-weight: 500; color: #94a3b8; display: block; margin-bottom: .175rem; }
    .dfield .val { font-size: .875rem; color: #1e293b; font-weight: 500; }
    .file-link { color: var(--maroon); font-size: .8125rem; }
    .info-banner { background: #eff6ff; border: 1px solid #bfdbfe; border-radius: .75rem; padding: 1rem 1.25rem; margin-bottom: 1.5rem; font-size: .8125rem; color: #1e40af; display: flex; align-items: center; gap: .75rem; }
    .info-banner i { font-size: 1.125rem; }
  </style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <img src="assets/psgcas logo-2.png" alt="PSG CAS">
    <span class="topbar-brand">PSG CAS <span>HR Portal</span></span>
  </div>
  <div class="topbar-right">
    <span class="role-badge">HR</span>
    <span class="user-info" id="user-info">…</span>
    <button class="btn-logout" id="btn-logout">Sign Out</button>
  </div>
</div>

<main class="main">
  <p class="page-title">Shortlisted Candidates</p>
  <p class="page-sub">View candidates who have been shortlisted by the Vice Principal.</p>

  <div class="info-banner">
    <i class="fa-solid fa-circle-info"></i>
    You can only view candidates with VP status "Shortlisted". Interview scheduling will be available in a future update.
  </div>

  <div class="stats-grid">
    <div class="stat-card"><div class="stat-val" id="s-total">–</div><div class="stat-label">Shortlisted Candidates</div></div>
  </div>

  <div class="table-card">
    <div class="table-header">
      <h3>Shortlisted <span id="count-label" style="color:#94a3b8;font-weight:400;font-size:.875rem;"></span></h3>
      <div class="ctrl-bar">
        <input type="text" id="search-input" placeholder="Search name, email, dept…" oninput="loadApps()">
        <button class="btn-refresh" onclick="loadApps()">&#8635;</button>
      </div>
    </div>
    <div id="table-wrap" style="overflow-x:auto;"></div>
  </div>
</main>

<!-- DETAIL MODAL -->
<div class="overlay" id="detail-overlay">
  <div class="modal-box">
    <div class="modal-head">
      <h2 id="modal-title">Candidate Details</h2>
      <button class="modal-close" id="modal-close">&times;</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-foot"><button id="modal-cancel">Close</button></div>
  </div>
</div>

<script>
  var token = sessionStorage.getItem('psg_token');
  var role  = sessionStorage.getItem('psg_role');
  if (!token || role !== 'hr') { window.location.href = 'login.html'; }

  document.getElementById('user-info').textContent = sessionStorage.getItem('psg_email');
  document.getElementById('btn-logout').addEventListener('click', function() { sessionStorage.clear(); window.location.href = 'login.html'; });

  function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  async function api(path, opts) {
    opts = opts || {};
    var res = await fetch(path, Object.assign({}, opts, {
      headers: Object.assign({ 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' }, opts.headers || {})
    }));
    if (res.status === 401) { sessionStorage.clear(); window.location.href = 'login.html'; }
    return res;
  }

  async function loadApps() {
    var wrap = document.getElementById('table-wrap');
    var q = document.getElementById('search-input').value;
    var url = '/api/applications?';
    if (q) url += 'q=' + encodeURIComponent(q) + '&';

    try {
      var res = await api(url);
      var data = await res.json();
      var apps = data.applications || [];

      document.getElementById('s-total').textContent = apps.length;
      document.getElementById('count-label').textContent = '(' + apps.length + ')';

      if (!apps.length) {
        wrap.innerHTML = '<div class="empty-state"><i class="fa-solid fa-inbox"></i>No shortlisted candidates yet.</div>';
        return;
      }

      var html = '<table><thead><tr><th>#</th><th>Name</th><th>Position</th><th>Department</th><th>Email</th><th>Mobile</th><th>Date</th><th>Actions</th></tr></thead><tbody>';
      apps.forEach(function(a, i) {
        var date = a.submitted_at ? new Date(a.submitted_at).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}) : '—';
        html += '<tr><td>' + (i+1) + '</td><td style="font-weight:600;">' + esc(a.name||'—') + '</td><td>' + esc(a.position||'—') + '</td><td>' + esc(a.department||'—') + '</td><td>' + esc(a.email||'—') + '</td><td>' + esc(a.mobile_no||'—') + '</td><td>' + date + '</td><td><button class="btn-view" onclick="viewApp(' + a.id + ')">View</button></td></tr>';
      });
      html += '</tbody></table>';
      wrap.innerHTML = html;
    } catch(e) { console.error(e); }
  }

  async function viewApp(id) {
    try {
      var res = await api('/api/applications/' + id);
      if (!res.ok) return;
      var app = await res.json();
      document.getElementById('modal-title').textContent = (app.name||'Candidate') + ' — ' + (app.position||'');
      var fields = {
        'Info': ['position','department','app_uuid','name','email','mobile_no'],
        'Academic': ['achivements','net','set_slet'],
        'Research': ['sci','scopus','ugc','h_index_google','h_index_scopus'],
        'Status': ['hod_status','vp_status']
      };
      var html = '';
      for (var sec in fields) {
        html += '<div class="dsec-title">' + sec + '</div><div class="dfgrid">';
        fields[sec].forEach(function(k) {
          var val = app[k] !== undefined && app[k] !== null ? String(app[k]) : '—';
          html += '<div class="dfield"><label>' + k.replace(/_/g,' ') + '</label><div class="val">' + esc(val) + '</div></div>';
        });
        html += '</div>';
      }
      if (app.resume_path) html += '<div class="dsec-title">Files</div><a href="' + app.resume_path + '" target="_blank" class="file-link">📄 View Resume</a>';
      document.getElementById('modal-body').innerHTML = html;
      document.getElementById('detail-overlay').classList.add('active');
    } catch(e) {}
  }

  ['modal-close','modal-cancel'].forEach(function(id) {
    document.getElementById(id).addEventListener('click', function() { document.getElementById('detail-overlay').classList.remove('active'); });
  });
  document.getElementById('detail-overlay').addEventListener('click', function(e) { if(e.target===e.currentTarget) e.currentTarget.classList.remove('active'); });

  loadApps();
</script>
</body>
</html>

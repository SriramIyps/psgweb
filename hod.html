<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PSG CAS — HOD Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root { --maroon:#7b1c1c; --maroon-dark:#5c1414; --gold:#c9a84c; }
    *, ::before, ::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Inter", system-ui, sans-serif; background: #f1f5f9; color: #0f172a; min-height: 100vh; }
    a { color: inherit; text-decoration: none; }
    .admin-topbar { background: #1e293b; padding: .875rem 1.5rem; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 40; }
    .topbar-left { display: flex; align-items: center; gap: .875rem; }
    .topbar-left img { height: 42px; border-radius: .375rem; }
    .topbar-brand { color: #fff; font-size: .9375rem; font-weight: 600; }
    .topbar-brand span { color: #818cf8; }
    .topbar-right { display: flex; align-items: center; gap: 1rem; }
    .role-badge { font-size: .72rem; font-weight: 700; padding: .25rem .75rem; border-radius: 9999px; background: #fef3c7; color: #92400e; }
    .user-info { font-size: .8125rem; color: #94a3b8; }
    .btn-logout { font-size: .8125rem; padding: .375rem .875rem; border-radius: .375rem; background: #ef4444; color: #fff; border: none; cursor: pointer; }
    .btn-logout:hover { background: #dc2626; }
    .admin-main { max-width: 1200px; margin: 0 auto; padding: 2rem; }
    .page-title { font-size: 1.375rem; font-weight: 700; color: #0f172a; margin-bottom: .25rem; }
    .page-sub { font-size: .875rem; color: #475569; margin-bottom: 1.5rem; }
    .dept-badge { display: inline-block; background: #ede9fe; color: #5b21b6; font-size: .72rem; font-weight: 700; padding: .2rem .65rem; border-radius: 9999px; margin-left: .5rem; vertical-align: middle; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1rem; margin-bottom: 1.75rem; }
    .stat-card { background: #fff; border-radius: .875rem; padding: 1.25rem 1rem; border: 1px solid #e2e8f0; }
    .stat-card .stat-val { font-size: 1.875rem; font-weight: 800; color: var(--maroon); }
    .stat-card .stat-label { font-size: .8125rem; color: #64748b; margin-top: .25rem; }
    .table-card { background: #fff; border-radius: .875rem; border: 1px solid #e2e8f0; overflow: hidden; }
    .table-header { padding: 1rem 1.25rem; border-bottom: 1px solid #e2e8f0; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: .75rem; }
    .table-header h3 { font-size: 1rem; font-weight: 600; }
    .ctrl-bar { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
    .ctrl-bar input { padding: .4375rem .75rem; border: 1px solid #e2e8f0; border-radius: .5rem; font-size: .8125rem; outline: none; width: 220px; }
    .ctrl-bar input:focus { border-color: var(--maroon); }
    .ctrl-bar select { padding: .4375rem .75rem; border: 1px solid #e2e8f0; border-radius: .5rem; font-size: .8125rem; outline: none; }
    .btn-refresh { padding: .4375rem .875rem; background: #f1f5f9; color: #334155; border: 1px solid #e2e8f0; border-radius: .5rem; font-size: .8125rem; cursor: pointer; }
    .btn-refresh:hover { background: #e2e8f0; }
    table { width: 100%; border-collapse: collapse; font-size: .8125rem; }
    thead th { background: #f8fafc; padding: .625rem 1rem; text-align: left; font-weight: 600; color: #475569; border-bottom: 1px solid #e2e8f0; white-space: nowrap; }
    tbody tr { border-bottom: 1px solid #f1f5f9; transition: background .1s; }
    tbody tr:hover { background: #fdf9f9; }
    tbody td { padding: .625rem 1rem; color: #334155; vertical-align: middle; }
    .status-badge { font-size: .7rem; font-weight: 600; padding: .15rem .5rem; border-radius: 9999px; }
    .s-pending { background: #fef9c3; color: #854d0e; }
    .s-eligible { background: #d1fae5; color: #065f46; }
    .s-not-eligible { background: #fce7f3; color: #831843; }
    .act-btns { display: flex; gap: .3rem; flex-wrap: nowrap; }
    .btn-view { padding: .3rem .6rem; font-size: .72rem; border-radius: .375rem; border: 1px solid #e2e8f0; background: #fff; cursor: pointer; color: #334155; }
    .btn-view:hover { background: #f1f5f9; }
    .btn-eligible { padding: .3rem .6rem; font-size: .72rem; border-radius: .375rem; background: #059669; color: #fff; border: none; cursor: pointer; }
    .btn-eligible:hover { background: #047857; }
    .btn-not-eligible { padding: .3rem .6rem; font-size: .72rem; border-radius: .375rem; background: #ef4444; color: #fff; border: none; cursor: pointer; }
    .btn-not-eligible:hover { background: #dc2626; }
    .empty-state { text-align: center; padding: 4rem 2rem; color: #94a3b8; }
    .empty-state i { font-size: 3rem; margin-bottom: 1rem; display: block; }
    .overlay { display: none; position: fixed; inset: 0; z-index: 200; background: rgba(15,23,42,.55); backdrop-filter: blur(4px); align-items: center; justify-content: center; padding: 1rem; }
    .overlay.active { display: flex; }
    .modal-box { background: #fff; border-radius: 1.25rem; padding: 0; width: 100%; max-width: 800px; max-height: 92vh; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 25px 50px -12px rgba(0,0,0,.25); animation: fadeUp .2s ease; }
    @keyframes fadeUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
    .modal-head { padding: 1.25rem 1.5rem; border-bottom: 1px solid #e2e8f0; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
    .modal-head h2 { font-size: 1rem; font-weight: 700; }
    .modal-close { background: none; border: none; font-size: 1.375rem; color: #94a3b8; cursor: pointer; line-height: 1; }
    .modal-close:hover { color: #0f172a; }
    .modal-body { padding: 1.5rem; overflow-y: auto; flex: 1; }
    .modal-foot { padding: 1rem 1.5rem; border-top: 1px solid #e2e8f0; display: flex; gap: .75rem; justify-content: flex-end; flex-shrink: 0; }
    .modal-foot button { padding: .5rem 1.25rem; border-radius: .5rem; font-size: .875rem; font-weight: 500; cursor: pointer; border: none; }
    .btn-cancel-modal { background: #f1f5f9; color: #334155; }
    .btn-cancel-modal:hover { background: #e2e8f0; }
    .dsec-title { font-size: .72rem; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: #94a3b8; margin: 1.25rem 0 .75rem; border-bottom: 1px solid #f1f5f9; padding-bottom: .375rem; }
    .dsec-title:first-child { margin-top: 0; }
    .dfgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: .875rem; }
    .dfield label { font-size: .72rem; font-weight: 500; color: #94a3b8; display: block; margin-bottom: .175rem; }
    .dfield .val { font-size: .875rem; color: #1e293b; font-weight: 500; }
    .file-link { color: var(--maroon); font-size: .8125rem; }
    .toast { position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 999; color: #fff; padding: .75rem 1.25rem; border-radius: .75rem; font-size: .875rem; font-weight: 500; box-shadow: 0 10px 30px rgba(0,0,0,.2); display: none; }
    .toast.show { display: block; animation: slideIn .2s ease; }
    @keyframes slideIn { from{transform:translateX(100%)} to{transform:translateX(0)} }
    .toast-success { background: #059669; }
    .toast-error { background: #dc2626; }
    .toast-info { background: #3b82f6; }
    .spinner { display: inline-block; width: 18px; height: 18px; border: 2.5px solid rgba(123,28,28,.2); border-top-color: var(--maroon); border-radius: 50%; animation: spin .7s linear infinite; }
    @keyframes spin { to{transform:rotate(360deg)} }
  </style>
</head>
<body>

<!-- TOPBAR -->
<div class="admin-topbar">
  <div class="topbar-left">
    <img src="assets/psgcas logo-2.png" alt="PSG CAS">
    <span class="topbar-brand">PSG CAS <span>HOD Portal</span></span>
  </div>
  <div class="topbar-right">
    <span class="role-badge" id="role-badge">HOD</span>
    <span class="user-info" id="user-info">…</span>
    <button class="btn-logout" id="btn-logout">Sign Out</button>
  </div>
</div>

<main class="admin-main">
  <p class="page-title">Department Applications <span class="dept-badge" id="dept-badge">…</span></p>
  <p class="page-sub" id="page-sub">Review candidates and mark them as Eligible or Not Eligible.</p>

  <div class="stats-grid">
    <div class="stat-card"><div class="stat-val" id="s-total">–</div><div class="stat-label">Total Applications</div></div>
    <div class="stat-card"><div class="stat-val" id="s-pending" style="color:#b45309;">–</div><div class="stat-label">Pending Review</div></div>
    <div class="stat-card"><div class="stat-val" id="s-eligible" style="color:#059669;">–</div><div class="stat-label">Eligible</div></div>
    <div class="stat-card"><div class="stat-val" id="s-not-eligible" style="color:#dc2626;">–</div><div class="stat-label">Not Eligible</div></div>
  </div>

  <div class="table-card">
    <div class="table-header">
      <h3>Applications <span id="count-label" style="color:#94a3b8;font-weight:400;font-size:.875rem;"></span></h3>
      <div class="ctrl-bar">
        <input type="text" id="search-input" placeholder="Search name, email…" oninput="loadApps()">
        <select id="filter-hod-status" onchange="loadApps()">
          <option value="">All Status</option>
          <option value="Pending">Pending</option>
          <option value="Eligible">Eligible</option>
          <option value="Not Eligible">Not Eligible</option>
        </select>
        <button class="btn-refresh" onclick="loadApps()">&#8635;</button>
      </div>
    </div>
    <div id="table-wrap" style="overflow-x:auto;"></div>
  </div>
</main>

<!-- DETAIL MODAL -->
<div class="overlay" id="detail-overlay">
  <div class="modal-box">
    <div class="modal-head">
      <h2 id="modal-title">Applicant Details</h2>
      <button class="modal-close" id="modal-close">&times;</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-foot">
      <button class="btn-cancel-modal" id="modal-cancel">Close</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  // ── AUTH GUARD ──
  var token = sessionStorage.getItem('psg_token');
  var role  = sessionStorage.getItem('psg_role');
  var dept  = sessionStorage.getItem('psg_department');
  if (!token || role !== 'hod') { window.location.href = 'login.html'; }

  document.getElementById('user-info').textContent = sessionStorage.getItem('psg_email');
  document.getElementById('dept-badge').textContent = dept || 'Unknown';
  document.getElementById('page-sub').textContent = 'Review ' + (dept || '') + ' candidates and mark them as Eligible or Not Eligible.';

  document.getElementById('btn-logout').addEventListener('click', function() {
    sessionStorage.clear(); window.location.href = 'login.html';
  });

  // ── API HELPER ──
  async function api(path, opts) {
    opts = opts || {};
    var res = await fetch(path, Object.assign({}, opts, {
      headers: Object.assign({ 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' }, opts.headers || {})
    }));
    if (res.status === 401) { sessionStorage.clear(); window.location.href = 'login.html'; }
    return res;
  }

  function toast(msg, type) { var t = document.getElementById('toast'); t.textContent = msg; t.className = 'toast show toast-' + (type||'info'); setTimeout(function(){ t.className = 'toast'; }, 3000); }
  function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  // ── LOAD APPLICATIONS ──
  async function loadApps() {
    var wrap = document.getElementById('table-wrap');
    var q = document.getElementById('search-input').value;
    var hodSt = document.getElementById('filter-hod-status').value;
    var url = '/api/applications?';
    if (q) url += 'q=' + encodeURIComponent(q) + '&';
    if (hodSt) url += 'hod_status=' + encodeURIComponent(hodSt) + '&';

    try {
      var res = await api(url);
      var data = await res.json();
      var apps = data.applications || [];

      document.getElementById('count-label').textContent = '(' + apps.length + ' records)';
      document.getElementById('s-total').textContent = apps.length;
      document.getElementById('s-pending').textContent = apps.filter(function(a){return a.hod_status==='Pending'}).length;
      document.getElementById('s-eligible').textContent = apps.filter(function(a){return a.hod_status==='Eligible'}).length;
      document.getElementById('s-not-eligible').textContent = apps.filter(function(a){return a.hod_status==='Not Eligible'}).length;

      if (!apps.length) {
        wrap.innerHTML = '<div class="empty-state"><i class="fa-solid fa-inbox"></i>No applications found for your department.</div>';
        return;
      }

      var html = '<table><thead><tr><th>#</th><th>Name</th><th>Position</th><th>Email</th><th>Mobile</th><th>Date</th><th>HOD Status</th><th>Actions</th></tr></thead><tbody>';
      apps.forEach(function(a, i) {
        var sc = {'Pending':'s-pending','Eligible':'s-eligible','Not Eligible':'s-not-eligible'}[a.hod_status] || 's-pending';
        var date = a.submitted_at ? new Date(a.submitted_at).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}) : '—';
        html += '<tr>';
        html += '<td>' + (i+1) + '</td>';
        html += '<td style="font-weight:600;">' + esc(a.name||'—') + '</td>';
        html += '<td>' + esc(a.position||'—') + '</td>';
        html += '<td>' + esc(a.email||'—') + '</td>';
        html += '<td>' + esc(a.mobile_no||'—') + '</td>';
        html += '<td>' + date + '</td>';
        html += '<td><span class="status-badge ' + sc + '">' + esc(a.hod_status||'Pending') + '</span></td>';
        html += '<td><div class="act-btns">';
        html += '<button class="btn-view" onclick="viewApp(' + a.id + ')">View</button>';
        if (a.hod_status === 'Pending') {
          html += '<button class="btn-eligible" onclick="reviewApp(' + a.id + ',\'Eligible\')">✓ Eligible</button>';
          html += '<button class="btn-not-eligible" onclick="reviewApp(' + a.id + ',\'Not Eligible\')">✗ Not Eligible</button>';
        }
        html += '</div></td></tr>';
      });
      html += '</tbody></table>';
      wrap.innerHTML = html;
    } catch(e) { console.error(e); }
  }

  // ── REVIEW ──
  async function reviewApp(id, status) {
    var confirm_msg = status === 'Eligible'
      ? 'Mark this candidate as Eligible?'
      : 'Mark this candidate as Not Eligible? This may exclude them from shortlisting.';
    if (!confirm(confirm_msg)) return;

    try {
      var res = await api('/api/applications/' + id + '/hod-review', {
        method: 'PUT', body: JSON.stringify({ hod_status: status })
      });
      var data = await res.json();
      if (res.ok) { toast('Marked as ' + status, 'success'); loadApps(); }
      else { toast(data.error || 'Failed', 'error'); }
    } catch(e) { toast('Error: ' + e, 'error'); }
  }

  // ── VIEW MODAL ──
  async function viewApp(id) {
    try {
      var res = await api('/api/applications/' + id);
      if (!res.ok) { toast('Failed to load details', 'error'); return; }
      var app = await res.json();

      var rRes = await api('/api/applications/' + id + '/research');
      var rData = rRes.ok ? await rRes.json() : { counts: {}, publications: [], patents: [], consultancy: [], projects: [] };
      var c = rData.counts || {};

      document.getElementById('modal-title').textContent = (app.name||'Applicant') + ' — ' + (app.position||'');

      var html = '<div style="background:#f8fafc; border:1px solid #e2e8f0; border-radius:.75rem; padding:1rem; margin-bottom:1.25rem;">';
      html += '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:.75rem;">';
      html += '<h4 style="font-size:.9rem; font-weight:700; color:#002e5b;">📊 Research Summary Counts</h4>';
      html += '<button onclick="downloadPdf(' + id + ')" style="background:#002e5b; color:#fff; padding:.35rem .85rem; border-radius:.375rem; border:none; font-weight:600; font-size:.75rem; cursor:pointer;">📥 Download PDF</button>';
      html += '</div>';
      html += '<div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(110px, 1fr)); gap:.5rem; text-align:center;">';
      html += '<div style="background:#fff; padding:.5rem; border-radius:.5rem; border:1px solid #cbd5e1;"><div style="font-size:1.1rem; font-weight:800; color:#7b1c1c;">' + (c.sci||0) + '</div><div style="font-size:.68rem; color:#64748b;">SCI Papers</div></div>';
      html += '<div style="background:#fff; padding:.5rem; border-radius:.5rem; border:1px solid #cbd5e1;"><div style="font-size:1.1rem; font-weight:800; color:#2563eb;">' + (c.scopus||0) + '</div><div style="font-size:.68rem; color:#64748b;">Scopus Papers</div></div>';
      html += '<div style="background:#fff; padding:.5rem; border-radius:.5rem; border:1px solid #cbd5e1;"><div style="font-size:1.1rem; font-weight:800; color:#059669;">' + (c.ugc_other||0) + '</div><div style="font-size:.68rem; color:#64748b;">UGC / Other</div></div>';
      html += '<div style="background:#fff; padding:.5rem; border-radius:.5rem; border:1px solid #cbd5e1;"><div style="font-size:1.1rem; font-weight:800; color:#d97706;">' + ((c.books||0)+(c.chapters||0)) + '</div><div style="font-size:.68rem; color:#64748b;">Books/Chapters</div></div>';
      html += '<div style="background:#fff; padding:.5rem; border-radius:.5rem; border:1px solid #cbd5e1;"><div style="font-size:1.1rem; font-weight:800; color:#7c3aed;">' + ((c.patents_published||0)+(c.patents_granted||0)) + '</div><div style="font-size:.68rem; color:#64748b;">Patents</div></div>';
      html += '<div style="background:#fff; padding:.5rem; border-radius:.5rem; border:1px solid #cbd5e1;"><div style="font-size:1.1rem; font-weight:800; color:#0891b2;">' + ((c.projects_major||0)+(c.projects_minor||0)) + '</div><div style="font-size:.68rem; color:#64748b;">Projects</div></div>';
      html += '</div></div>';

      var sections = {
        'Application': ['position','department','app_uuid'],
        'Personal': ['name','dob','gender','email','mobile_no','father_name','category','community'],
        'Status': ['hod_status','vp_status','admin_notes']
      };

      for (var sec in sections) {
        html += '<div class="dsec-title">' + sec + '</div><div class="dfgrid">';
        sections[sec].forEach(function(k) {
          var val = app[k] !== undefined && app[k] !== null ? String(app[k]) : '—';
          html += '<div class="dfield"><label>' + k.replace(/_/g,' ') + '</label><div class="val">' + esc(val) + '</div></div>';
        });
        html += '</div>';
      }

      // Structured Publications
      html += '<div class="dsec-title">Publications (' + (rData.publications||[]).length + ')</div>';
      if ((rData.publications||[]).length) {
        html += '<table style="margin-bottom:.75rem;"><thead><tr><th>Type</th><th>Indexing</th><th>Title</th><th>Publisher/Journal</th><th>Year</th></tr></thead><tbody>';
        rData.publications.forEach(function(p) {
          html += '<tr><td>' + esc(p.type||'—') + '</td><td>' + esc(p.indexing_category||p.scope||'—') + '</td><td style="font-weight:600;">' + esc(p.title||'—') + '</td><td>' + esc(p.publisher_journal||'—') + '</td><td>' + esc(p.year||'—') + '</td></tr>';
        });
        html += '</tbody></table>';
      } else { html += '<p style="font-size:.8rem;color:#94a3b8;margin-bottom:.75rem;">No publications listed.</p>'; }

      // Structured Patents & Projects
      html += '<div class="dsec-title">Patents & Projects</div>';
      html += '<div class="dfgrid">';
      html += '<div class="dfield"><label>Patents (' + (rData.patents||[]).length + ')</label><div class="val">' + ((rData.patents||[]).map(function(pt){return esc(pt.title)+' ['+esc(pt.status)+']';}).join('<br/>') || 'None') + '</div></div>';
      html += '<div class="dfield"><label>Projects (' + (rData.projects||[]).length + ')</label><div class="val">' + ((rData.projects||[]).map(function(pr){return esc(pr.title)+' ['+esc(pr.type)+' Project, Role: '+esc(pr.role||'PI')+']';}).join('<br/>') || 'None') + '</div></div>';
      html += '</div>';

      if (app.resume_path) html += '<div class="dsec-title">Files</div><a href="' + app.resume_path + '" target="_blank" class="file-link">📄 View Resume</a>';
      document.getElementById('modal-body').innerHTML = html;
      document.getElementById('detail-overlay').classList.add('active');
    } catch(e) { toast('Error loading details', 'error'); }
  }

  async function downloadPdf(id) {
    try {
      var res = await fetch('/api/applications/' + id + '/pdf', { headers: { 'Authorization': 'Bearer ' + token } });
      if (!res.ok) { toast('PDF generation failed', 'error'); return; }
      var blob = await res.blob();
      var url = URL.createObjectURL(blob);
      window.open(url, '_blank');
    } catch(e) { toast('Error downloading PDF', 'error'); }
  }


  ['modal-close','modal-cancel'].forEach(function(id) {
    document.getElementById(id).addEventListener('click', function() { document.getElementById('detail-overlay').classList.remove('active'); });
  });
  document.getElementById('detail-overlay').addEventListener('click', function(e) { if(e.target===e.currentTarget) e.currentTarget.classList.remove('active'); });

  // ── INIT ──
  loadApps();
</script>
</body>
</html>
